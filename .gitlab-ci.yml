stages:
  - test
  - publish_docker
  - deploy_docker

variables:
  APP_NAME: spotslog
  APP_URL: https://spotslog.ssomar.fr
  APP_PORT: "3095"    # must match traefik/dynamic/spotslog.yml
  MINIO_PORT: "3096"  # must match traefik/dynamic/spotslog.yml
  S3_BUCKET: spotslog-photos

# ---------- Test (branches non-main) ----------
test_frontend:
  stage: test
  image: node:24-alpine
  except:
    - main
  cache:
    key: frontend-${CI_COMMIT_REF_SLUG}
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build

test_backend:
  stage: test
  image: golang:1.25-alpine
  except:
    - main
  variables:
    CGO_ENABLED: "0"
    GOPATH: ${CI_PROJECT_DIR}/.go
  cache:
    key: backend-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
  script:
    - cd backend
    - go vet ./...
    - go build ./...
    - go test ./...

# ---------- Build & Push Docker image (main) ----------
publish_docker:
  stage: publish_docker
  image: quay.io/podman/stable
  only:
    - main
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - podman build -t "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - podman push "$CI_REGISTRY_IMAGE:latest"
    - podman push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# ---------- Deploy via SSH + Podman (main) ----------
deploy_docker:
  stage: deploy_docker
  image: alpine:latest
  only:
    - main
  needs:
    - publish_docker
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    # Fail fast if a variable is empty (e.g. marked "Protected" but branch isn't).
    - |
      for v in DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DB_SCHEMA JWT_SECRET S3_ACCESS_KEY S3_SECRET_KEY; do
        eval "val=\${$v}"
        [ -n "$val" ] || { echo "CI variable $v is empty or not set"; exit 1; }
      done
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p ~/traefik/dynamic"
    - scp -P "$SSH_PORT" traefik/dynamic/* "$SSH_USER@$SSH_HOST:~/traefik/dynamic/"
    - |
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << ENDSSH
        set -e
        echo "$CI_REGISTRY_PASSWORD" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        podman pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

        podman network exists $APP_NAME || podman network create $APP_NAME

        # Photo storage. Recreated on every deploy so its credentials always match
        # the app's S3_ACCESS_KEY/S3_SECRET_KEY; photos persist in the named volume.
        podman run --name $APP_NAME-minio -d --replace \
          -p 127.0.0.1:$MINIO_PORT:9000 \
          --network $APP_NAME \
          -e MINIO_ROOT_USER='${S3_ACCESS_KEY}' \
          -e MINIO_ROOT_PASSWORD='${S3_SECRET_KEY}' \
          -v $APP_NAME-minio-data:/data \
          --restart always \
          quay.io/minio/minio:latest server /data
        for i in \$(seq 1 30); do
          curl -sf http://127.0.0.1:$MINIO_PORT/minio/health/live && break
          sleep 1
        done

        podman run --name $APP_NAME -d --replace \
          -p 127.0.0.1:$APP_PORT:8080 \
          --network $APP_NAME \
          -e PORT=8080 \
          -e DATABASE_URL='postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&search_path=${DB_SCHEMA}' \
          -e JWT_SECRET='${JWT_SECRET}' \
          -e JWT_EXPIRY_HOURS='${JWT_EXPIRY_HOURS:-72}' \
          -e S3_ENDPOINT='$APP_NAME-minio:9000' \
          -e S3_ACCESS_KEY='${S3_ACCESS_KEY}' \
          -e S3_SECRET_KEY='${S3_SECRET_KEY}' \
          -e S3_BUCKET='${S3_BUCKET}' \
          -e S3_USE_SSL=false \
          -e S3_PUBLIC_BASE_URL='${APP_URL}/${S3_BUCKET}' \
          -e CORS_ALLOWED_ORIGIN='${APP_URL}' \
          --restart always \
          "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

        podman image prune -f || true
      ENDSSH
